name: CI - Test, Lint and Typecheck

on:
  pull_request:
    branches:
      - develop-github-actions
    types:
      - opened
      - synchronize
      - reopened
jobs:
  ci-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
    
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
        
      - name: Run linter
        run: npm run lint

      - name: Run type checker
        run: npm run typecheck